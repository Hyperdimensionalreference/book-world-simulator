<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>杏花沟 · 一季秋事 · 书中世界模拟器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div id="app">
    <!-- 启动屏 -->
    <section id="screen-home" class="screen">
      <div class="home-bg"></div>
      <div class="home-card">
        <div class="brand-mark">书中世界模拟器</div>
        <h1 class="home-title">杏花沟</h1>
        <p class="home-sub">一季秋事</p>
        <p class="home-lead">
          立秋刚过，风已经硬了。你叫马小满，二十二。<br />
          书上写定的事会按期来。你改不了大势——<br />
          但你和谁站在一起、付出什么、被人怎样记住，这些是你的。
        </p>
        <div class="book-picker">
          <div class="book-label">选择要进入的书中世界</div>
          <div id="book-list" class="book-list"></div>
        </div>
        <button id="btn-start" class="btn-primary">走进杏花沟</button>
        <p class="home-hint">游玩过程离线运行，不调用 AI · 换书不换引擎 · 选择会被记住</p>
      </div>
    </section>

    <!-- 游玩屏 -->
    <section id="screen-game" class="screen hidden">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-mini">书中世界模拟器</div>
          <div class="jieqi">
            <span id="turn-label">立秋前</span>
            <span id="turn-note" class="turn-note"></span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="player-chip">
            <span class="player-name" id="player-name">马小满</span>
            <span class="player-tag">小人物</span>
          </div>
          <button id="btn-home" class="btn-ghost">回首页</button>
        </div>
      </header>

      <div class="layout">
        <!-- 左侧状态 -->
        <aside class="side">
          <div class="panel">
            <h3 class="panel-title">处境</h3>
            <div id="stat-list" class="stat-list"></div>
          </div>
          <div class="panel">
            <h3 class="panel-title">关系</h3>
            <div id="rel-list" class="rel-list"></div>
          </div>
          <div class="panel">
            <h3 class="panel-title">这一季的定数</h3>
            <div id="canon-timeline" class="canon-timeline"></div>
          </div>
        </aside>

        <!-- 主叙事 -->
        <main class="main">
          <div id="message-stack" class="message-stack"></div>

          <article id="scene-card" class="scene-card hidden">
            <div class="scene-meta">
              <div>
                <div class="scene-place" id="scene-place"></div>
                <h2 class="scene-title" id="scene-title"></h2>
              </div>
              <div class="npc-row" id="scene-npcs"></div>
            </div>
            <div class="scene-body" id="scene-body"></div>
            <div class="choice-list" id="choice-list"></div>
          </article>

          <article id="pick-card" class="scene-card hidden">
            <div class="scene-meta">
              <div>
                <div class="scene-place">今天</div>
                <h2 class="scene-title">时间只有一份</h2>
              </div>
            </div>
            <div class="scene-body">
              <p id="pick-hint">今天你只能顾上一件事。该来的定数躲不开，其余由你取舍。</p>
            </div>
            <div class="choice-list" id="pick-list"></div>
          </article>

          <article id="ending-card" class="ending-card hidden">
            <div class="ending-kicker">回望 · 我成为了谁</div>
            <h2 class="ending-title" id="ending-title"></h2>
            <div class="ending-body" id="ending-body"></div>
            <div class="ending-epithet" id="ending-epithet"></div>
            <div class="ending-actions">
              <button id="btn-again" class="btn-primary">再活一季</button>
              <button id="btn-timeline" class="btn-ghost">看看走过的路</button>
            </div>
            <div id="memory-log" class="memory-log hidden"></div>
          </article>
        </main>

        <!-- 右侧风声 -->
        <aside class="side side-right">
          <div class="panel">
            <h3 class="panel-title">风声</h3>
            <div id="rumor-list" class="rumor-list">
              <p class="empty-tip">墙根的闲话，总会先到一步。</p>
            </div>
          </div>
          <div class="panel">
            <h3 class="panel-title">迟来的事</h3>
            <div id="pending-list" class="pending-list">
              <p class="empty-tip">有些后果不会当场结算。</p>
            </div>
          </div>
          <div class="panel">
            <h3 class="panel-title">记得</h3>
            <div id="memory-list" class="memory-list">
              <p class="empty-tip">世界会记住你做过的事。</p>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
